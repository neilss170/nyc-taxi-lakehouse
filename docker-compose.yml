services:
  spark:
    build: .
    image: nyc-taxi-lakehouse:latest
    working_dir: /app
    volumes:
      - .:/app
      # Data lives in a named volume: Delta writes to a Windows bind mount are slow and would skew benchmarks.
      - lakehouse-data:/data
    ports:
      - "4040:4040"
    environment:
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-5g}
      KAFKA_BOOTSTRAP: kafka:9092

  # Single-node Kafka (KRaft, no ZooKeeper) for the kafka stage. Opt in: docker compose --profile kafka up -d kafka
  kafka:
    image: apache/kafka:3.9.1
    profiles: ["kafka"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3            # topics are auto-created by the producer with 3 partitions
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m # leave the 8 GB VM to Spark
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

volumes:
  lakehouse-data:
